{% from "_macros.html" import brand_logo with context %}
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>{% block title %}Tankly Operator{% endblock %}</title>
    <script src="/static/vendor/tailwindcss.js"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
    <header class="border-b border-slate-800 bg-slate-900/90 backdrop-blur">
        <div class="mx-auto flex max-w-7xl flex-col gap-4 px-4 py-4 sm:flex-row sm:items-center sm:justify-between">
            <div class="flex items-center gap-3">
                {{ brand_logo("h-10 w-10 rounded-xl") }}
                <div>
                    <p class="text-lg font-bold tracking-tight text-white">Tankly Operator</p>
                    <p class="text-xs font-medium uppercase tracking-[0.2em] text-slate-400">Internal dashboard</p>
                </div>
            </div>
            <nav class="flex flex-wrap items-center gap-2 text-sm font-semibold">
                <a href="/platform/farms" class="rounded-lg px-3 py-2 {% if request.url.path.startswith('/platform/farms') %}bg-slate-800 text-white{% else %}text-slate-300 hover:bg-slate-800/70 hover:text-white{% endif %}">Betriebe</a>
                <a href="/platform/users" class="rounded-lg px-3 py-2 {% if request.url.path.startswith('/platform/users') %}bg-slate-800 text-white{% else %}text-slate-300 hover:bg-slate-800/70 hover:text-white{% endif %}">Benutzer</a>
                <a href="/groups" class="rounded-lg px-3 py-2 text-slate-400 hover:bg-slate-800/70 hover:text-white">Zur App</a>
            </nav>
        </div>
    </header>
    <main class="mx-auto max-w-7xl px-4 py-8">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
